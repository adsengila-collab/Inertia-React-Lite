openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: images
    description: Image scraping operations
  - name: keywords
    description: Keyword management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /images/search:
    get:
      operationId: searchImages
      tags: [images]
      summary: Search and scrape images from DuckDuckGo
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: count
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageResult"
                  query:
                    type: string
                required: [images, query]
        "500":
          description: Scraping failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /keywords:
    get:
      operationId: listKeywords
      tags: [keywords]
      summary: List keywords with pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of keywords
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordListResponse"

    post:
      operationId: addKeywords
      tags: [keywords]
      summary: Add keywords in bulk (one per line)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddKeywordsBody"
      responses:
        "200":
          description: Keywords added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddKeywordsResponse"

  /keywords/random:
    get:
      operationId: getRandomKeywords
      tags: [keywords]
      summary: Get random keywords for home page
      parameters:
        - name: count
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Random keywords
          content:
            application/json:
              schema:
                type: object
                properties:
                  keywords:
                    type: array
                    items:
                      $ref: "#/components/schemas/Keyword"
                required: [keywords]

  /keywords/delete:
    post:
      operationId: deleteKeywords
      tags: [keywords]
      summary: Delete keywords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords:
                  type: array
                  items:
                    type: string
              required: [keywords]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                required: [deleted]

  /keywords/stats:
    get:
      operationId: getKeywordsStats
      tags: [keywords]
      summary: Get keyword count stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordsStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ImageResult:
      type: object
      properties:
        title:
          type: string
        image:
          type: string
        thumbnail:
          type: string
        source:
          type: string
      required: [title, image, thumbnail, source]

    Keyword:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required: [name, slug]

    KeywordListResponse:
      type: object
      properties:
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/Keyword"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required: [keywords, total, page, limit, totalPages]

    AddKeywordsBody:
      type: object
      properties:
        text:
          type: string
          description: Keywords, one per line
      required: [text]

    AddKeywordsResponse:
      type: object
      properties:
        added:
          type: integer
        duplicates:
          type: integer
        total:
          type: integer
      required: [added, duplicates, total]

    KeywordsStats:
      type: object
      properties:
        total:
          type: integer
        lastUpdated:
          type: string
      required: [total, lastUpdated]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
